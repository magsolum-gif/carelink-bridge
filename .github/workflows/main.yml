name: Run Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
        node-version: 24
        package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run Bridge
        run: timeout 90s npm start || test $? -eq 124
        env:
          CARELINK_USERNAME: ${{ secrets.CARELINK_USERNAME }}
          CARELINK_PASSWORD: ${{ secrets.CARELINK_PASSWORD }}
          CARELINK_REGION: ${{ secrets.CARELINK_REGION }}
          CARELINK_PATIENT: ${{ secrets.CARELINK_PATIENT }}
          NS: ${{ secrets.NS }}
          API_SECRET: ${{ secrets.API_SECRET }}
