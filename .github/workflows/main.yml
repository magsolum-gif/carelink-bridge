name: Run Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create CareLink login data
        env:
          CARELINK_LOGINDATA: ${{ secrets.CARELINK_LOGINDATA }}
        run: printf '%s' "$CARELINK_LOGINDATA" > logindata.json

      - name: Run Bridge
        run: timeout 90s npm start || test $? -eq 124
        env:
          CARELINK_USERNAME: ${{ secrets.CARELINK_USERNAME }}
          CARELINK_PASSWORD: ${{ secrets.CARELINK_PASSWORD }}
          CARELINK_REGION: ${{ secrets.CARELINK_REGION }}
          CARELINK_PATIENT: ${{ secrets.CARELINK_PATIENT }}
          NS: ${{ secrets.NS }}
          API_SECRET: ${{ secrets.API_SECRET }}
